<style>
/* Layout: a full-screen 3D snowfield with one slim top row (cash · current goal · menu); HP and labels live in the world,
   event banners drop into the middle, choice cards (relics, elements) open as modal panels.
   Single committed dark look on purpose: it is a game screen over a bright world. */
:root{
  --ink:#081222; --glass:rgba(9,18,36,.78); --glass2:rgba(14,26,50,.94); --edge:rgba(143,227,255,.26); --edge2:rgba(143,227,255,.5);
  --fg:#eef5fc; --muted:#9db3cc; --frost:#8fe3ff; --gold:#ffd25a; --cash:#6fe39a; --gem:#9fe3ff; --ember:#ff8a3c; --blood:#ff4d5e; --violet:#c19bff;
  --display:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--ui);font-size:12px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;background:var(--ink);touch-action:none;overflow:hidden}
#c{position:absolute;left:0;top:0}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#vigHurt{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:inset 0 0 60px 16px rgba(255,40,60,.9)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(10,20,40,.28) 100%)}
#weather{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
#weather.blizzard{opacity:1;background:radial-gradient(ellipse at center,rgba(255,255,255,0) 35%,rgba(235,244,255,.75) 100%)}
#weather.night{opacity:1;background:radial-gradient(ellipse at center,rgba(10,14,40,0) 30%,rgba(6,8,30,.55) 100%)}
#weather.aurora{opacity:1;background:linear-gradient(180deg,rgba(80,255,200,.22),rgba(150,110,255,.12) 30%,rgba(0,0,0,0) 55%);animation:aur 6s ease-in-out infinite alternate}
@keyframes aur{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(60deg)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,var(--fc,#fff) 0%,rgba(255,255,255,0) 70%)}
#flash.on{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}#weather.aurora{animation:none}.banner.show{animation:none}}
button{font-family:inherit;cursor:pointer;touch-action:none;color:inherit}
button:focus-visible{outline:2px solid var(--frost);outline-offset:2px}

/* ---------- HUD: one row on top, everything else lives in the world ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.slab{background:var(--glass);border:1px solid var(--edge);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#topbar{display:flex;align-items:stretch;gap:6px;width:100%;max-width:520px}
.cur{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:12px;font-family:var(--display);font-size:17px;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1.1;flex:none;color:var(--cash)}
.cur svg{width:20px;height:20px;flex:none}
#goal{pointer-events:auto;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:7px;padding:5px 9px 7px;text-align:left;position:relative;overflow:hidden}
#gNo{font-family:var(--display);font-size:11px;color:#062033;background:var(--frost);border-radius:6px;padding:1px 5px;line-height:1.3}
#gTxt{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#gProg{font-size:10.5px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
#gBar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.1)}
#gFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cash),#b8ffcf);transition:width .25s}
#goal.done{border-color:rgba(111,227,154,.8);box-shadow:0 0 18px rgba(111,227,154,.45)}
#goal.done #gNo{background:var(--cash)}
#goal.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 0 rgba(143,227,255,.9)}100%{box-shadow:0 0 0 14px rgba(143,227,255,0)}}
#btnMenu{pointer-events:auto;width:38px;flex:none;padding:0;display:grid;place-items:center;border-radius:12px}
#btnMenu svg{width:18px;height:18px}
#alert{padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:900;color:#ffb3b3;border-color:rgba(255,77,94,.55);font-variant-numeric:tabular-nums}
#alert.cool{color:#dff3ff;border-color:var(--edge2)}
.bar{height:12px;border-radius:999px;background:rgba(0,0,0,.45);position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .15s}
#bossBar{width:min(88vw,420px);padding:5px 10px 7px;border-color:rgba(255,77,94,.55)}
#bossBar .bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
#bossName{font-family:var(--display);font-size:14px;color:#ffb3b3;letter-spacing:.02em}
#bossSub{font-size:10px;font-weight:700;color:var(--muted)}
#bossBar .bar{height:8px} #bossFill{background:linear-gradient(90deg,#ff3b4f,#ff8a3c)}
#joy{position:absolute;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.14));box-shadow:0 0 0 2px rgba(255,255,255,.35);pointer-events:none;z-index:3}
#joyKnob{position:absolute;left:29px;top:29px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);background:var(--glass2);border:1px solid var(--edge);color:var(--fg);padding:7px 14px;border-radius:999px;max-width:86vw;text-align:center;pointer-events:none;z-index:5;font-weight:700;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast.ok{color:var(--cash)}#toast.warn{color:var(--gold)}#toast.bad{color:#ff8a8a}
/* event banner */
.banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;width:min(84vw,380px);padding:9px 16px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(14,26,50,.94),rgba(8,16,32,.9));border:1px solid var(--bc,var(--edge2));box-shadow:0 0 0 1px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45),0 0 30px var(--bg2,rgba(143,227,255,.25))}
.banner .bk{font-size:10px;font-weight:900;letter-spacing:.24em;color:var(--bc,var(--frost));margin-bottom:2px}
.banner .bt{font-family:var(--display);font-size:24px;line-height:1.1;color:#fff;text-shadow:0 0 18px var(--bc,var(--frost));text-wrap:balance}
.banner .bs{font-size:11.5px;font-weight:700;color:#d6e3f2;margin-top:5px;text-wrap:balance}
.banner.show{animation:bnIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes bnIn{from{transform:translate(-50%,-50%) scale(.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.k-raid,.k-bad{--bc:#ff6b5e;--bg2:rgba(255,80,60,.35)} .k-gold,.k-camp,.k-win,.k-conquer{--bc:#ffd25a;--bg2:rgba(255,210,90,.35)}
.k-evolve,.k-relic{--bc:#e3b8ff;--bg2:rgba(193,155,255,.4)} .k-mission{--bc:#6fe39a;--bg2:rgba(111,227,154,.3)} .k-blizzard{--bc:#e8f4ff;--bg2:rgba(232,244,255,.4)}
.k-aurora{--bc:#7ff0d0;--bg2:rgba(127,240,208,.35)} .k-thief{--bc:#c19bff;--bg2:rgba(193,155,255,.35)} .k-pet,.k-def{--bc:#8fe3ff} .k-rush{--bc:#ffb347;--bg2:rgba(255,179,71,.35)} .k-ult{--bc:var(--uc,#fff);--bg2:rgba(255,255,255,.4)}
#padCard{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(92vw,400px);padding:8px 12px 10px;display:flex;flex-direction:column;gap:4px;pointer-events:none;text-align:left}
#padCard .pc1{display:flex;align-items:baseline;gap:8px} #pcName{font-family:var(--display);font-weight:400;font-size:17px;color:#fff;letter-spacing:.02em} #pcLv{font-size:11px;font-weight:900;color:var(--frost)} #pcCost{margin-left:auto;font-style:normal;font-family:var(--display);font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums} #pcCost.no{color:#c3cedd}
#pcEff{font-size:12px;font-weight:700;color:#dff3ff} #pcNext{font-size:11px;font-weight:800;color:var(--gold)} #pcNext.far{color:#b9c6d8;font-weight:700}
#padCard .bar{height:5px;margin-top:2px} #pcFill{background:linear-gradient(90deg,var(--cash),#b8ffcf)}
#padCard.lock #pcName{color:#9aa7ba}
#vigDanger{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:inset 0 0 90px 30px rgba(255,60,60,.75)}
#duelUI{position:absolute;inset:0;pointer-events:none}
#xhair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.35)}
#xhair::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
#duelWarn{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);font-family:var(--display);font-size:20px;color:#ffb3b3;text-shadow:0 2px 0 #3a0a0a,0 0 18px rgba(255,80,60,.7);letter-spacing:.03em;white-space:nowrap;animation:warnIn .25s ease-out}
@keyframes warnIn{from{transform:translateX(-50%) scale(1.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#duelArrow{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#ffb3b3;text-shadow:0 0 14px rgba(255,80,60,.8);animation:arrowPulse .6s ease-in-out infinite alternate}
#duelArrow.l{left:14px} #duelArrow.r{right:14px}
@keyframes arrowPulse{from{opacity:.5}to{opacity:1}}
#duelHint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);transform:translateX(-50%);font-size:11.5px;font-weight:800;color:#dff3ff;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:5px 12px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#duelBars{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);transform:translateX(-50%);width:min(60vw,300px);display:flex;flex-direction:column;gap:4px}
#duelBars .db{display:flex;align-items:center;gap:8px} #duelBars .db span{font-size:10px;font-weight:900;color:#dff3ff;width:26px;text-shadow:0 1px 0 #000} #duelBars .bar{flex:1;height:9px}
#dHp{background:linear-gradient(90deg,#6fe39a,#b8ffcf)} #dSt{background:linear-gradient(90deg,#9ff0ff,#4cc3f0)}
#duelBtns{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:flex-end;gap:12px;pointer-events:auto}
#duelBtns button{border-radius:50%;border:2px solid rgba(255,255,255,.55);font-family:var(--display);font-size:15px;color:#fff;text-shadow:0 1px 0 #000;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);touch-action:none;-webkit-user-select:none;user-select:none}
#btnAtk{width:84px;height:84px;background:radial-gradient(circle at 40% 35%,rgba(255,170,120,.95),rgba(214,57,47,.9))}
#btnBlk{width:66px;height:66px;background:radial-gradient(circle at 40% 35%,rgba(170,230,255,.95),rgba(44,120,180,.9))}
#duelBtns button:active,#duelBtns button.on{transform:scale(.93);filter:brightness(1.25)}
body.notouch #duelBtns{display:none}
body.notouch #duelHint{display:none}
#duelHintPc{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);transform:translateX(-50%);font-size:11.5px;font-weight:800;color:#dff3ff;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:5px 12px;white-space:nowrap;display:none}
body.notouch #duelHintPc.show{display:block}
#combo{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:22px;color:var(--gold);text-shadow:0 2px 0 #5a3a00,0 0 18px rgba(255,210,90,.6);letter-spacing:.04em;pointer-events:none;animation:comboPop .25s ease-out}
@keyframes comboPop{from{transform:translateX(-50%) scale(1.3)}to{transform:translateX(-50%) scale(1)}}
#xpBar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(70vw,360px);display:flex;align-items:center;gap:8px;pointer-events:none}
#xpBar .bar{flex:1;height:7px} #xpFill{background:linear-gradient(90deg,#9ff0ff,#c6a8ff)}
#xpLv{font-family:var(--display);font-size:13px;color:#dff3ff;text-shadow:0 1px 0 #000}
body.chal #cashBox{color:var(--gold)}
/* title: modes, account, login, ranking */
.acct{margin:0;font-size:11.5px;color:var(--muted);font-weight:600}
.acct.on{color:#cfe9d8} .acct.off{color:#c3a86a}
.link{background:none;border:0;padding:0 2px;color:var(--frost);font-weight:900;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.link.big{font-size:13px}
.modes{display:flex;flex-direction:column;gap:8px;text-align:left}
.mode{display:flex;flex-direction:column;gap:6px;padding:10px 11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--edge)}
.mode .mh{display:flex;flex-direction:column;gap:1px} .mode .mh b{font-family:var(--display);font-weight:400;font-size:17px;color:#fff;letter-spacing:.02em} .mode .mh small{color:var(--muted);font-size:11px;font-weight:600}
.mode .ms{font-size:11px;font-weight:700;color:#dff3ff}

.fld input:focus{border-color:var(--frost);box-shadow:0 0 0 3px rgba(143,227,255,.18)}

.ranks{display:flex;flex-direction:column;gap:3px}

.rank b{font-family:var(--display);font-weight:400;color:var(--muted);text-align:center} .rank:nth-child(1) b{color:var(--gold)} .rank:nth-child(2) b{color:#dfe9f5} .rank:nth-child(3) b{color:#d9a066}
.rank small{color:var(--muted);font-weight:700} .rank em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:900}
.rank.me{background:rgba(143,227,255,.14);border:1px solid var(--edge2)}
/* multiplayer lobby */
.chip{font:inherit;font-size:11px;font-weight:800;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:999px;padding:4px 9px;margin:1px 2px}
.chip.on{background:rgba(143,227,255,.22);border-color:var(--frost);color:#fff}
.row b .chip{font-size:11px}
.joinrow{display:flex;gap:8px;align-items:stretch}

.joinrow .btn{width:auto;padding:10px 18px}
/* panels */
#overlay{position:absolute;inset:0;background:rgba(4,8,18,.66);display:flex;align-items:center;justify-content:center;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:10}

.row span{font-weight:700} .row span small{color:var(--muted);font-weight:500}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.title{text-align:center;display:flex;flex-direction:column;gap:8px}
.logo{font-family:var(--display);font-size:46px;line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 2px 0 #1e4f80,0 0 26px rgba(143,227,255,.55);margin-top:4px}
.logo span{background:linear-gradient(180deg,#ffffff,#9fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:10px;font-weight:900;letter-spacing:.32em;color:var(--frost)}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.feat span{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(143,227,255,.1);border:1px solid var(--edge);color:#dcecfa}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11.5px;font-weight:700}
.stats span small{display:block;color:var(--muted);font-weight:500;font-size:10px}
/* choice cards */
.picks{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;gap:11px;align-items:center;text-align:left;width:100%;padding:11px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1.5px solid var(--rc,var(--edge));box-shadow:0 0 0 0 transparent}
.rc:active{transform:scale(.98)}
.rc .ri{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.18),rgba(255,255,255,.03));border:1px solid var(--rc,var(--edge))}
.rc .rt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc .rn{font-family:var(--display);font-size:16px;color:#fff}
.rc .rr{font-size:9.5px;font-weight:900;letter-spacing:.12em;color:var(--rc,var(--muted))}
.rc .rd{font-size:11.5px;color:#d3e0ee;font-weight:500}
.r1{--rc:rgba(157,179,204,.7)} .r2{--rc:#c19bff} .r3{--rc:#ffd25a;box-shadow:0 0 18px rgba(255,210,90,.3)}
.e-fire{--rc:#ff8a3c} .e-ice{--rc:#8fe8ff} .e-bolt{--rc:#ffe45c}
.miss{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(143,227,255,.14)}
.miss .ml{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}
.miss .ml small{color:var(--gold);font-weight:900;flex:none}
.miss .gbar{height:5px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.miss .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cash),#b8ffcf)}
.req{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.req.ok{color:var(--cash)} .req span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.lairs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lair{padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(143,227,255,.14);font-size:11.5px;font-weight:700}
.lair small{display:block;color:var(--muted);font-weight:500;font-size:10px}
.lair.done{border-color:rgba(255,210,90,.6);color:var(--gold)}
.credit{color:var(--muted);font-size:10px;margin:0}
.ladder{display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 9px;border-radius:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.04);color:#9fb0c6}
.step b{font-family:var(--display);font-weight:400;font-size:12px;text-align:center}
.step.done{opacity:.55} .step.done b{color:var(--cash)}
.step.now{background:rgba(143,227,255,.14);border:1px solid var(--edge2);color:#fff} .step.now b{color:var(--frost)}
.step.final{border:1px dashed rgba(255,210,90,.6);color:var(--gold)} .step.final b{color:var(--gold)}
.step small{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.gap{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.3em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="눈보라 캠프 게임 화면"></canvas>
  <canvas id="ov"></canvas>
  <div id="vig"></div>
  <div id="weather"></div>
  <div id="vigHurt"></div>
  <div id="vigDanger"></div>
  <div id="flash"></div>
  <div id="hud">
    <div id="topbar">
      <div id="cashBox" class="cur slab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="3" fill="#2f9e5c"/><rect x="4" y="8" width="16" height="8" rx="2" fill="#46c27a"/><circle cx="12" cy="12" r="3" fill="#ffd25a"/></svg><span id="cashTxt">$0</span></div>
      <button id="goal" class="slab" type="button" aria-label="목표 보기"><span id="gNo">1</span><span id="gTxt"></span><span id="gProg"></span><i id="gBar"><i id="gFill"></i></i></button>
      <button id="btnMenu" class="slab" type="button" aria-label="메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="#eef5fc" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div id="alert" class="slab" hidden></div>
    <div id="bossBar" class="slab" hidden><div class="bh"><b id="bossName"></b><span id="bossSub"></span></div><div class="bar"><i id="bossFill"></i></div></div>
    <div id="combo" hidden></div>
    <div id="duelUI" hidden>
      <div id="xhair"></div>
      <div id="duelWarn" hidden></div>
      <div id="duelArrow" hidden></div>
      <div id="duelHint" hidden>드래그로 이동 · 시점은 자동 · 공격은 꾹 · 맞기 직전에 방어하면 완벽 방어</div>
      <div id="duelHintPc">WASD 이동 · 시점은 자동으로 보스를 향함 · J 공격 (꾹) · K 방어 (맞기 직전이면 완벽 방어)</div>
      <div id="duelBars"><div class="db"><span>체력</span><div class="bar"><i id="dHp"></i></div></div><div class="db"><span>기력</span><div class="bar"><i id="dSt"></i></div></div></div>
      <div id="duelBtns"><button type="button" id="btnBlk" aria-label="방어">방어</button><button type="button" id="btnAtk" aria-label="공격">공격</button></div>
    </div>
    <div id="padCard" class="slab" hidden><div class="pc1"><b id="pcName"></b><span id="pcLv"></span><em id="pcCost"></em></div><div id="pcEff"></div><div id="pcNext" hidden></div><div class="bar"><i id="pcFill"></i></div></div>
    <div id="xpBar" hidden><span id="xpLv">Lv.1</span><div class="bar"><i id="xpFill"></i></div></div>
  </div>
  <div id="banner" class="banner" hidden><div class="bk" id="bnKick"></div><div class="bt" id="bnTitle"></div><div class="bs" id="bnSub"></div></div>
  <div id="joy" hidden><div id="joyKnob"></div></div>
  <div id="toast" hidden></div>
  <div id="overlay" hidden><div id="panel"></div></div>
</div>

function genWorld(seed,arena){
  const R=mulberry32(seed);const map=new Uint8Array(MW*MH),trees=[];
  const cx=MW/2,cy=MH/2;
  const lairT=arena?[]:LAIRS.map(L=>({x:(CX+L.x)/TILE,y:(CY+L.y)/TILE})).concat([{x:(CX+THRONE.x)/TILE,y:(CY+THRONE.y)/TILE}]);
  const nearLair=(tx,ty,r)=>lairT.some(q=>dist(tx,ty,q.x,q.y)<r);
  const keep=arena?16:14;
  for(let i=0;i<6;i++){const lx=6+R()*(MW-12),ly=6+R()*(MH-12),rx=2+R()*2,ry=1.5+R()*1.5;if(dist(lx,ly,cx,cy)<keep||nearLair(lx,ly,7))continue;
    const x0=Math.max(0,Math.floor(lx-rx-1)),x1=Math.min(MW-1,Math.ceil(lx+rx+1)),y0=Math.max(0,Math.floor(ly-ry-1)),y1=Math.min(MH-1,Math.ceil(ly+ry+1));
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(((tx-lx)/rx)**2+((ty-ly)/ry)**2<1)map[ty*MW+tx]=1;}}
  for(let i=0;i<28;i++){const lx=3+R()*(MW-6),ly=3+R()*(MH-6),r=1.5+R()*3;
    const x0=Math.max(0,Math.floor(lx-r-1)),x1=Math.min(MW-1,Math.ceil(lx+r+1)),y0=Math.max(0,Math.floor(ly-r-1)),y1=Math.min(MH-1,Math.ceil(ly+r+1));
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const k=ty*MW+tx;if(map[k]===0&&dist(tx,ty,lx,ly)<r)map[k]=3;}}
  for(let i=0;i<(arena?24:48);i++){const tx=1+Math.floor(R()*(MW-2)),ty=1+Math.floor(R()*(MH-2));if(dist(tx,ty,cx,cy)<(arena?17:12)||nearLair(tx,ty,6))continue;const k=ty*MW+tx;if(map[k]===0||map[k]===3)map[k]=2;}
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){if(tx===0||ty===0||tx===MW-1||ty===MH-1)map[ty*MW+tx]=2;}
  if(!arena){const fl=Math.floor((CX+FENCE.l)/TILE),fr=Math.ceil((CX+FENCE.r)/TILE),ft=Math.floor((CY+FENCE.t)/TILE),fb=Math.ceil((CY+FENCE.b)/TILE);
    for(let ty=ft;ty<fb;ty++)for(let tx=fl;tx<fr;tx++)map[ty*MW+tx]=4+((tx+ty)%2);
    for(let tx=Math.max(1,fl-22);tx<fl;tx++)for(let ty=Math.floor((CY+4)/TILE);ty<=Math.floor((CY+44)/TILE);ty++){map[ty*MW+tx]=3;}}
  function addTree(tx,ty){tx=Math.round(tx);ty=Math.round(ty);if(tx<2||ty<2||tx>=MW-2||ty>=MH-2)return;if(dist(tx,ty,cx,cy)<(arena?16:11)||nearLair(tx,ty,6))return;const k=ty*MW+tx;if(map[k]!==0&&map[k]!==3)return;trees.push({x:tx*TILE+8,y:ty*TILE+16});}
  for(let c=0;c<(arena?22:34);c++){const ccx=4+R()*(MW-8),ccy=4+R()*(MH-8);const n=3+Math.floor(R()*5);for(let i=0;i<n;i++)addTree(ccx+(R()-0.5)*7,ccy+(R()-0.5)*7);}
  return{map,trees};
}

function inFence(x,y,noGate){if(G.noCamp)return false;const c=G.camp,l=c.x+FENCE.l,r=c.x+FENCE.r,t=c.y+FENCE.t,b=c.y+FENCE.b;

  for(const h of G.hunters)updateHunter(h,dt);
  updateWeapon(dt);updatePet(dt);updateEvents(dt);updateQuest(dt);updateTele(dt);updateUlt(dt);updateLairs(dt);updateFence(dt);
  updateItems(dt);updateShop(dt);updateCustomers(dt);updateSled(dt);updateDelivery(dt);updatePads(dt);updateDefense(dt);updateShots(dt);updateRent(dt);updateFx(dt);

}

function hitEnemy(e,dmg,src,who,opt){if(e.hp<=0)return;opt=opt||{};

function spawnOk(x,y,minP){if(x<36||y<36||x>WW-36||y>WH-36)return false;if(dist(x,y,G.p.x,G.p.y)<minP)return false;if(!G.noCamp&&Math.abs(x-G.camp.x)<140&&Math.abs(y-G.camp.y)<120)return false;if(solidTile(x,y))return false;const ty=Math.floor(y/TILE),tx=Math.floor(x/TILE);if(G.map[ty*MW+tx]===1)return false;return true;}
function spawnEnemy(type,x,y,state,lvlO){const T=TYPES[type],lvl=lvlO||enemyLevel(x,y),m=Math.pow(1.22,lvl-1)*BM(G.biome);const hp=Math.round(T.hp*m);
  const e={type,x,y,home:{x,y},hp,maxHp:hp,dmg:Math.round(T.dmg*Math.pow(1.11,lvl-1)*Math.pow(6,G.biome)*10)/10,spd:T.spd,meat:T.meat+Math.floor(lvl/3),r:T.r,ag:T.ag,lvl,state:state||'wander',tgt:null,tgtKind:null,bite:0.6,wait:rnd(0,2),tx:x,ty:y,face:'left',anim:Math.random()*3,flash:0,kx:0,ky:0,giveUp:0,gone:false,sq:0};
  G.enemies.push(e);return e;}
function makeElite(e){e.elite=true;e.hp=e.maxHp=Math.round(e.maxHp*4);e.dmg*=1.6;e.r*=1.3;e.meat*=3;e.spd*=0.9;return e;}
function targetValid(e){const t=e.tgt;if(!t)return false;if(t===G.p)return !G.p.dead&&!inCompound(t.x,t.y);return t.state!=='dead'&&t.hp>0&&!inCompound(t.x,t.y);}
function updateEnemy(e,dt){
  if(e.boss){updateBoss(e,dt);return;}
  if(inCompound(e.x,e.y)){e.gone=true;return;}
  e.anim+=dt;if(e.flash>0)e.flash-=dt;if(e.lunge>0)e.lunge-=dt;if(e.sq>0)e.sq-=dt;
  if(e.kx||e.ky){moveEnt(e,e.kx*dt,e.ky*dt,2);const f=Math.pow(0.02,dt);e.kx*=f;e.ky*=f;if(Math.abs(e.kx)<2)e.kx=0;if(Math.abs(e.ky)<2)e.ky=0;}
  const p=G.p,spd=e.spd*(e.slow>0?0.5:1)*(G.night?1.4:1);
  if(e.golden){updateGolden(e,dt,spd);return;}
  if(G.ch){updateChalEnemy(e,dt,spd);return;}
  if(e.state==='raid'){
    if(!p.dead&&!inCompound(p.x,p.y)&&dist(e.x,e.y,p.x,p.y)<e.ag*0.8){e.state='chase';e.tgt=p;e.tgtKind='p';e.home={x:e.x,y:e.y};return;}
    const fp=fencePoint(e.x,e.y);if(dist(e.x,e.y,fp.x,fp.y)>e.r*0.5+5)steer(e,fp.x,fp.y,spd,dt,2);
    else{e.bite-=dt;if(e.bite<=0){e.bite=1.2;e.lunge=0.15;damageFence(e.r>=12?0.02:0.007);}}
    return;}
  if(e.state==='wander'){
    if(!p.dead&&!inCompound(p.x,p.y)&&dist(e.x,e.y,p.x,p.y)<e.ag){e.state='chase';e.tgt=p;e.tgtKind='p';if(e.r>=12)sfx('growl');}
    else{for(const h of G.hunters){if(h.state==='dead'||inCompound(h.x,h.y))continue;if(dist(e.x,e.y,h.x,h.y)<e.ag*0.8){e.state='chase';e.tgt=h;e.tgtKind='h';break;}}}
    if(e.state==='wander'){if(e.wait>0){e.wait-=dt;}else if(dist(e.x,e.y,e.tx,e.ty)<4){e.wait=rnd(1,3);e.tx=clamp(e.home.x+rnd(-60,60),30,WW-30);e.ty=clamp(e.home.y+rnd(-60,60),30,WH-30);}
      else if(!steer(e,e.tx,e.ty,spd*0.6,dt,2)){e.wait=rnd(0.5,1.5);e.tx=e.x;e.ty=e.y;}
      if(e.hp<e.maxHp)e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.05*dt);}
  }else if(e.state==='chase'){
    if(!targetValid(e)||dist(e.x,e.y,e.home.x,e.home.y)>260){e.state='return';e.tgt=null;return;}
    const t=e.tgt,d=dist(e.x,e.y,t.x,t.y),tr=e.r+(t===p?6:5);
    if(d>tr){const moved=steer(e,t.x,t.y,spd,dt,2);e.bite=Math.min(e.bite,0.6);if(!moved){e.giveUp+=dt;if(e.giveUp>2.5){e.giveUp=0;e.state='return';e.tgt=null;}}else e.giveUp=0;}
    else{e.bite-=dt;if(e.bite<=0){e.bite=1.1;e.lunge=0.15;if(t===p)hurtPlayer(e.dmg,e);else hurtHunter(t,e.dmg);sfx('bite');}}
  }else{
    if(dist(e.x,e.y,e.home.x,e.home.y)<6||!steer(e,e.home.x,e.home.y,spd*0.9,dt,2)){e.state='wander';e.wait=1;e.tx=e.x;e.ty=e.y;}
    if(e.hp<e.maxHp)e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.15*dt);}
}
function separate(){const bs=G.enemies,n=bs.length;if(n<2)return;bs.sort((a,b)=>a.x-b.x);
  for(let i=0;i<n;i++){const a=bs[i];for(let j=i+1;j<n;j++){const b=bs[j];const dx=b.x-a.x;const minD=(a.r+b.r)*0.9;if(dx>minD)break;const dy=b.y-a.y;if(Math.abs(dy)>minD)continue;const d=Math.hypot(dx,dy)||0.01;if(d>=minD)continue;const push=(minD-d)/2,ux=dx/d,uy=dy/d;const wa=a.boss?0:a.r>=12?0.15:1,wb=b.boss?0:b.r>=12?0.15:1,s=wa+wb||1;a.x-=ux*push*2*wa/s;a.y-=uy*push*2*wa/s;b.x+=ux*push*2*wb/s;b.y+=uy*push*2*wb/s;}}}
// ===== hunters =====
function gatePt(){return wp(0,FENCE.t-12);}
function gatePts(g){return g==='right'?[wp(FENCE.r+14,-25),wp(FENCE.r-12,-25)]:[wp(0,FENCE.t-12),wp(0,FENCE.t+10)];}
function goVia(h,tx,ty,sp,dt,gate){const insideMe=inCompound(h.x,h.y),insideT=inCompound(tx,ty);
  if(insideMe!==insideT){const g=gatePts(gate),g1=insideMe?g[1]:g[0],g2=insideMe?g[0]:g[1];
    if(!h.viaGate){if(dist(h.x,h.y,g1.x,g1.y)>5){h.walking=true;steer(h,g1.x,g1.y,sp,dt,1);return false;}h.viaGate=true;}
    if(dist(h.x,h.y,g2.x,g2.y)>5){h.walking=true;steer(h,g2.x,g2.y,sp,dt,1);return false;}
    h.viaGate=false;return false;}
  h.viaGate=false;h.walking=true;steer(h,tx,ty,sp,dt,1);return true;}
function hurtHunter(h,dmg){h.hp-=dmg;h.flash=0.15;h.lastHit=G.time;if(h.hp<=0){h.state='dead';h.deadT=10;h.carry=0;}}
function updateHunter(h,dt){h.anim+=dt;if(h.flash>0)h.flash-=dt;if(h.atkCd>0)h.atkCd-=dt;if(h.atkT>0)h.atkT-=dt;h.walking=false;
  const maxHp=Math.round(60*Math.pow(1.12,G.up.hp)*BM(G.biome));h.maxHp=maxHp;
  if(h.state==='dead'){h.deadT-=dt;if(h.deadT<=0){const t=wp(POS.tent.x,POS.tent.y+14);h.x=t.x;h.y=t.y;h.hp=maxHp;h.state='out';}return;}
  if(h.hp<maxHp&&G.time-h.lastHit>4)h.hp=Math.min(maxHp,h.hp+maxHp*0.05*dt);
  const sp=62,load=h.carry;
  if(h.state==='out'){
    let best=null,bd=1e9;for(const e of G.enemies){if(e.hp<=0||e.boss||e.golden)continue;const dc=dist(e.x,e.y,G.camp.x,G.camp.y);if(dc>300)continue;const d=dist(h.x,h.y,e.x,e.y);if(d<bd){bd=d;best=e;}}
    if(load>=12||(!best&&load>0)){h.state='back';return;}
    if(!best){const g=gatePt();if(dist(h.x,h.y,g.x,g.y)>14)goVia(h,g.x+(h.id%3-1)*12,g.y-6,sp,dt);else h.dir='up';return;}
    if(bd-best.r>14){goVia(h,best.x,best.y,sp,dt);}
    else{const dx=best.x-h.x,dy=best.y-h.y;h.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');if(h.atkCd<=0){h.atkCd=0.8;h.atkT=0.18;hitEnemy(best,Math.round(3+0.4*P.dmg()),h,'h');}}
  }else{
    const s=wp(POS.shelf.x,POS.shelf.y+8);
    if(dist(h.x,h.y,s.x,s.y)<22){if(load>0){h.depT=(h.depT||0)+dt;if(h.depT>0.05){h.depT=0;const n=Math.min(h.carry,6);h.carry-=n;G.stock.raw+=n;flyer(h.x,h.y-12,s.x,s.y-8,'meat');}}else h.state='out';}
    else goVia(h,s.x+6,s.y,sp,dt);}
}

  if(G.up.grill>0){const g=wp(POS.grill.x,POS.grill.y);if(G.cooking>0){G.cookT-=dt;if(G.cookT<=0){G.stock.cooked+=G.cooking;G.cooking=0;flyer(g.x,g.y-14,s.x,s.y-8,'cooked');}}

function countersOpen(){return COUNTERS.filter(c=>G.up.camp>=c.need);}
function stockSellable(){const s=G.stock;return s.cooked+s.raw;}
function takeUnit(){const s=G.stock;if(s.cooked>0){s.cooked--;G.stats.steaks++;return STEAK_X;}if(s.raw>0){s.raw--;return 1;}return 0;}
function earn(v,src){G.stats.earned+=v;G.life.earned+=v;}
function incomeEvMul(){return (G.auroraT>0?3:1)*(G.lava&&G.lava.length?2:1);}
function demandOf(ci){return G.ev&&G.ev.kind==='rush'?1.5:1;}
function updateCustomers(dt){
  const open=countersOpen(),closed=G.closedT>0,rush=G.ev&&G.ev.kind==='rush';
  if(!closed)for(const ct of open){const ci=COUNTERS.indexOf(ct);G.custT[ci]-=dt*(rush?3:1);
    if(G.custT[ci]<=0){G.custT[ci]=P.custInt()*rnd(0.7,1.3);const waiting=G.customers.filter(c=>c.ci===ci&&c.state!=='leave').length;
      if(waiting<P.queueMax()+(rush?6:0)){const sp=wp(ct.spawn.x+(ct.wall==='bottom'?rnd(-8,8):0),ct.spawn.y+(ct.wall==='bottom'?0:rnd(-8,8)));G.customers.push({x:sp.x,y:sp.y,ci,col:ri(0,3),state:'walk',pat:30,dir:'right',anim:0,carry:null,bub:null,bubT:0,walking:false});}}}
  G.dm=[0,1,2].map(ci=>demandOf(ci));
  const qi=[0,0,0];
  for(const c of G.customers){c.anim+=dt;c.walking=false;const ct=COUNTERS[c.ci];
    if(closed&&c.state!=='leave'){c.state='leave';c.bub='…';c.bubT=1.2;}
    if(c.state==='leave'){const sp=wp(ct.spawn.x,ct.spawn.y);if(dist(c.x,c.y,sp.x,sp.y)<10)c.gone=true;else{c.walking=true;steer(c,sp.x,sp.y,80,dt,0);}continue;}
    const q=ct.queue(qi[c.ci]),qp=wp(q.x,q.y);const first=qi[c.ci]===0;qi[c.ci]++;
    if(dist(c.x,c.y,qp.x,qp.y)>3){c.walking=true;steer(c,qp.x,qp.y,80,dt,0);c.state='walk';}
    else{c.state='queue';c.dir=ct.wall==='left'?'right':ct.wall==='right'?'left':'up';c.pat-=dt;
      if(first){const cs=wp(ct.cashier.x,ct.cashier.y);const seller=G.up.cashier>0||(!G.p.dead&&dist(G.p.x,G.p.y,cs.x,cs.y)<30);
        if(stockSellable()>0&&seller){G.serveP[c.ci]+=dt;if(G.serveP[c.ci]>=P.serveT()){G.serveP[c.ci]=0;sellTo(c);}}
        else G.serveP[c.ci]=0;}
      if(c.pat<=0){c.state='leave';c.bub='…';c.bubT=1.5;}}
    if(c.bubT>0){c.bubT-=dt;if(c.bubT<=0)c.bub=null;}}
  G.customers=G.customers.filter(c=>!c.gone);
}
function sellTo(c){const n=P.buyN();let units=0,val=0,best=0;for(let i=0;i<n;i++){const v=takeUnit();if(!v)break;units++;val+=v;best=Math.max(best,v);G.stats.sold++;}
  if(!units)return;
  const price=Math.round(P.price()*val*G.dm[c.ci]*P.income()*incomeEvMul());G.pile+=price;earn(price);
  c.carry=best>=STEAK_X?'cooked':'meat';c.state='leave';c.bub='♥';c.bubT=1.2;
  const cp=wp(POS.cash.x,POS.cash.y);flyer(c.x,c.y-14,cp.x,cp.y-4,'bill');sfx('sell');}

function updateDelivery(dt){const p=G.p;

function padCost(k){return Math.round(UPG[k].cost(G.up[k]-((G.upBase&&G.upBase[k])||0))*BM(G.biome));}
function padVisible(k){if(k==='migrate')return !G.noCamp&&G.conquered;return !G.noCamp&&G.q.i>=(PAD_AT[k]||0);}
function padLockMsg(k){if(k==='camp'&&!campAllowed())return '목표 진행';return null;}
function updatePads(dt){const p=G.p;if(p.dead){G.padOn=null;return;}
  for(const pd of PADS){if(!padVisible(pd.k))continue;const w=wp(pd.x,pd.y);if(Math.abs(p.x-w.x)>PAD_HX||Math.abs(p.y-w.y)>PAD_HY)continue;
    const k=pd.k;if(G.padOn!==k){G.padOn=k;G.dwell=0;}G.dwell+=dt;
    if(k==='migrate'){if(!p.moving&&G.dwell>0.8&&!G.migAsked){G.migAsked=true;openMigrate();}return;}
    if(padLockMsg(k))return;
    if(G.dwell<0.2||G.cash<=0||(p.moving&&G.dwell<1.2))return;
    G.payT=(G.payT||0)+dt;
    while(G.payT>0.05&&G.cash>0){G.payT-=0.05;const cost=padCost(k),paid=G.paid[k]||0;const amt=Math.min(G.cash,cost-paid,Math.max(1,Math.ceil(cost/6)));G.cash-=amt;G.paid[k]=paid+amt;flyer(p.x,p.y-12,w.x,w.y-4,'bill');sfx('cash');
      if(G.paid[k]>=cost){G.paid[k]-=cost;applyUpgrade(k);if(padLockMsg(k))break;}}
    return;}
  G.padOn=null;G.payT=0;G.migAsked=false;}
function applyUpgrade(k,silent){const prevTier=P.tier();G.up[k]++;const l=G.up[k];if(!silent){sfx('up');const pd=PADS.find(q=>q.k===k);if(pd){const w=wp(pd.x,pd.y);addFx(w.x,w.y-16,UPG[k].n+' Lv.'+l,'#6fe39a');}}
  if(k==='hp')G.p.hp=Math.min(P.maxHp(),G.p.hp+P.maxHp()*0.3);
  else if(k==='weapon'){const t=P.tier();if(t>prevTier)onEvolve(t);}
  else if(k==='hunter'){syncHunters();if(l===1)toast('사냥꾼이 알아서 사냥하고 고기를 가져온다','ok');}
  else if(k==='grill'&&l===1)toast('고기를 스테이크로 구워 3배에 판다','ok');
  else if(k==='pet'){if(l===5||l===10){banner('펫 진화',PET_FORMS[petForm(l)]+'(으)로 진화했다','pet');G.slowT=0.5;}}
  else if(k==='camp')onCampUp(l);

  else if(k==='defense'){const s=DEF_STAGES.find(q=>q.lv===l);if(s&&l>1)toast('방어탑 진화 · '+s.n,'ok');}
  if(G.hintStep===4)G.hintStep=5;if(!G.ch)save();}

function updateSled(dt){if(G.up.whole<=0)return;const c=G.camp;const gate={x:c.x+FENCE.r+16,y:c.y+(RGATE.y0+RGATE.y1)/2},far={x:c.x+FENCE.r+190,y:c.y+(RGATE.y0+RGATE.y1)/2+10};

  const s=G.sled;s.anim+=dt;
  if(s.state==='come'){if(dist(s.x,s.y,gate.x,gate.y)<4){s.state='load';s.t=0;}else steer(s,gate.x,gate.y,120,dt,0);}
  else if(s.state==='load'){s.t+=dt;const rate=wholeRate(G.up.whole)/100;if(s.t>0.05&&stockSellable()>0){s.t=0;const tot=stockSellable();const n=Math.min(Math.max(6,Math.ceil(tot/12)),tot);let val=0;for(let i=0;i<n;i++){val+=takeUnit();s.load++;G.stats.sold++;}s.paid+=val*P.price()*rate*P.income();const sh=wp(POS.shelf.x,POS.shelf.y);flyer(sh.x,sh.y-8,s.x,s.y-8,'meat');}
    else if(stockSellable()<=0){if(s.t>0.5){const cs=wp(POS.cash.x,POS.cash.y);s.paid=Math.round(s.paid);G.pile+=s.paid;earn(s.paid);for(let i=0;i<6;i++)flyer(s.x+rnd(-6,6),s.y-8,cs.x+rnd(-8,8),cs.y-4,'bill');addFx(s.x,s.y-30,'도매 +$'+fmtN(s.paid),'#6fe39a');sfx('up');s.state='leave';}}}
  else{if(dist(s.x,s.y,far.x,far.y)<6)G.sled=null;else steer(s,far.x,far.y,120,dt,0);}}
function updateRent(dt){if(G.up.camp<=0)return;G.rentT-=dt;if(G.rentT>0)return;G.rentT=10;const r=rentOf(G.up.camp);G.pile+=r;earn(r);const sh=wp(POS.shelter.x,POS.shelter.y),cs=wp(POS.cash.x,POS.cash.y);for(let i=0;i<3;i++)flyer(sh.x+rnd(-10,10),sh.y-10,cs.x,cs.y-4,'bill');}
// ===== defense tower =====
function clusterTarget(cx,cy,R,r2){let best=null,bs=-1;for(const e of G.enemies){if(e.hp<=0||e.sleep||dist(e.x,e.y,cx,cy)>R)continue;let n=0;for(const o of G.enemies){if(o.hp>0&&dist(o.x,o.y,e.x,e.y)<r2)n++;}const sc=n+(e.r>=12?2:0)+(e.boss?4:0);if(sc>bs){bs=sc;best=e;}}return best;}
function updateDefense(dt){const c=G.camp,l=G.up.defense;if(l<=0)return;
  const nT=turretCount(l);
  for(let i=0;i<nT;i++){G.turretT[i]-=dt;if(G.turretT[i]>0)continue;const tx=c.x+TURRETS[i].x,ty=c.y+TURRETS[i].y;let best=null,bd=160;for(const e of G.enemies){if(e.hp<=0||e.sleep)continue;const d=dist(e.x,e.y,tx,ty);if(d<bd){bd=d;best=e;}}
    if(best){G.turretT[i]=turretRate(l);G.turretAim[i]=Math.atan2(best.y-ty,best.x-tx);G.shots.push({kind:'bullet',x:tx,y:ty-16,tgt:best,spd:340,dmg:turretDmg(l),t:0});sfx('shot');}else G.turretT[i]=0.1;}
  if(missileOn(l)){G.missileT-=dt;if(G.missileT<=0){const lx=c.x+POS.launcher.x,ly=c.y+POS.launcher.y;const t=clusterTarget(lx,ly,300,40);
    if(t){G.missileT=missileInt(l);const n=missileN(l);for(let k=0;k<n;k++){let tt=t;if(k>0){const o=G.enemies.filter(e=>e.hp>0&&!e.sleep&&dist(e.x,e.y,lx,ly)<300);if(o.length)tt=pick(o);}G.shots.push({kind:'missile',x:lx,y:ly-14,sx:lx,sy:ly-14,tx:tt.x,ty:tt.y,tgt:tt,t:0,dur:0.9+k*0.15,dmg:missileDmg(l),rad:48});}sfx('launch');}else G.missileT=0.3;}}
}
function explode(x,y,rad,dmg,who,col){G.booms.push({x,y,r:rad,t:0,col:col||0xff8a1f});spawnParts(x,y,'#ffd872',8);spawnParts(x,y,'#ff8a1f',6);sfx('boom');
  const src={x,y};for(const e of G.enemies){if(e.hp<=0||e.sleep)continue;if(dist(e.x,e.y-6,x,y)<rad+e.r)hitEnemy(e,dmg,src,who||'d');}}
function updateShots(dt){
  for(const sh of G.shots){sh.t+=dt;
    if(sh.kind==='bullet'){const tg=sh.tgt;if(!tg||tg.hp<=0){sh.dead=true;continue;}const dx=tg.x-sh.x,dy=tg.y-6-sh.y,d=Math.hypot(dx,dy);const step=sh.spd*dt;if(d<=step+tg.r){sh.dead=true;hitEnemy(tg,sh.dmg,{x:sh.x,y:sh.y},'d');continue;}sh.x+=dx/d*step;sh.y+=dy/d*step;sh.ang=Math.atan2(dy,dx);if(sh.t>2)sh.dead=true;}
    else if(sh.kind==='missile'){const k=Math.min(1,sh.t/sh.dur);if(sh.tgt&&sh.tgt.hp>0&&k<0.7){sh.tx=sh.tgt.x;sh.ty=sh.tgt.y;}sh.x=sh.sx+(sh.tx-sh.sx)*k;sh.y=sh.sy+(sh.ty-sh.sy)*k;sh.z=Math.sin(k*Math.PI)*40;sh.ang=Math.atan2(sh.ty-sh.sy,sh.tx-sh.sx);
      if(k>=1){sh.dead=true;explode(sh.tx,sh.ty,sh.rad,sh.dmg,'d');}}
    else if(sh.kind==='star'){const step=Math.hypot(sh.vx,sh.vy)*dt;
      if(sh.back){const p=G.p;const dx=p.x-sh.x,dy=p.y-8-sh.y,d=Math.hypot(dx,dy);if(d<step+6||p.dead){sh.dead=true;continue;}sh.vx=dx/d*520;sh.vy=dy/d*520;sh.a=Math.atan2(sh.vy,sh.vx);}
      sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.dist+=step;
      for(const e of G.enemies){if(e.hp<=0||e.sleep||sh.hit.has(e))continue;if(Math.abs(e.x-sh.x)>e.r+8||Math.abs(e.y-6-sh.y)>e.r+8)continue;if(dist(e.x,e.y-6,sh.x,sh.y)<e.r+7){sh.hit.add(e);hitEnemy(e,sh.dmg,{x:sh.x-sh.vx*0.05,y:sh.y-sh.vy*0.05},'s',{kb:0.5});if(sh.hit.size>=sh.pierce&&!sh.ret){sh.dead=true;break;}if(sh.ret&&!sh.back&&sh.hit.size>=sh.pierce){sh.back=true;sh.hit.clear();}}}
      if(!sh.dead&&!sh.back&&(sh.dist>sh.max||solidTile(sh.x,sh.y)||sh.x<10||sh.y<10||sh.x>WW-10||sh.y>WH-10)){if(sh.ret){sh.back=true;sh.hit.clear();}else sh.dead=true;}
      if(sh.back&&sh.dist>sh.max*3)sh.dead=true;}
    else if(sh.kind==='arrow'||sh.kind==='sblade'){const step=Math.hypot(sh.vx,sh.vy)*dt;if(sh.trail){sh.trail.push({x:sh.x,y:sh.y});if(sh.trail.length>5)sh.trail.shift();}sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.dist+=step;
      for(const e of G.enemies){if(e.hp<=0||e.sleep||sh.hit.has(e))continue;if(Math.abs(e.x-sh.x)>e.r+8||Math.abs(e.y-6-sh.y)>e.r+8)continue;if(dist(e.x,e.y-6,sh.x,sh.y)<e.r+7){sh.hit.add(e);hitEnemy(e,sh.dmg,{x:sh.x-sh.vx*0.05,y:sh.y-sh.vy*0.05},sh.kind==='arrow'?'a':'s',{kb:0.7});
        if(sh.hit.size>=sh.pierce){sh.dead=true;break;}}}
      if(!sh.dead&&(sh.dist>sh.max||solidTile(sh.x,sh.y)||sh.x<10||sh.y<10||sh.x>WW-10||sh.y>WH-10))sh.dead=true;
      if(sh.dead&&sh.kind==='arrow'&&sh.boom)explode(sh.x,sh.y,34,sh.dmg*0.6,'a',cls().col);}
    else if(sh.kind==='orb'){const k=Math.min(1,sh.t/sh.dur);if(sh.trail){sh.trail.push({x:sh.x,y:sh.y,z:sh.z||0});if(sh.trail.length>6)sh.trail.shift();}if(sh.tgt&&sh.tgt.hp>0&&k<0.6){sh.tx=sh.tgt.x;sh.ty=sh.tgt.y;}sh.x=sh.sx+(sh.tx-sh.sx)*k;sh.y=sh.sy+(sh.ty-sh.sy)*k;sh.z=Math.sin(k*Math.PI)*34;
      if(k>=1){sh.dead=true;explode(sh.tx,sh.ty,sh.rad,sh.dmg,'m',G.element&&P.tier()>=elemTier()?ELEM[G.element].c:0xb08cff);
        if(sh.zone&&G.zones.length<8)G.zones.push({x:sh.tx,y:sh.ty,r:sh.rad*0.8,t:0,dur:2.2,tick:0,dmg:sh.dmg*0.25});}}}
  G.shots=G.shots.filter(s=>!s.dead);
  for(const b of G.booms)b.t+=dt;G.booms=G.booms.filter(b=>b.t<0.4);
  for(const z of G.zones){z.t+=dt;z.tick-=dt;if(z.tick<=0){z.tick=0.5;for(const e of G.enemies){if(e.hp<=0||e.sleep)continue;if(dist(e.x,e.y,z.x,z.y)<z.r+e.r)hitEnemy(e,z.dmg,z,'b');}}}
  G.zones=G.zones.filter(z=>z.t<z.dur);
}
// ===== save / load =====
function hasSave(){try{return !!(localStorage.getItem(SAVE_KEY)||localStorage.getItem(OLD_KEY));}catch(e){return false;}}
function serialize(){return{v:5,t:Date.now(),seed:G.seed,cls:G.cls,up:G.up,upBase:G.upBase,cash:G.cash,stock:G.stock,paid:G.paid,pile:G.pile,day:G.day,dayT:G.dayT,time:G.time,stats:G.stats,hintStep:G.hintStep,carry:G.p.carry,
  relics:G.relics,element:G.element,ult:G.ult,fence:G.fence,clock:G.clock,weatherN:G.weatherN,raidN:G.raidN,lairs:G.lairs.map(l=>({cool:l.cool,lv:l.lv})),lairDone:G.lairDone,conquered:G.conquered,
  q:G.q,raidsOn:G.raidsOn,lairOpen:G.lairOpen,medals:G.medals,biome:G.biome,life:G.life,pick:G.pick};}
function save(force){if(!G||!G.live||G.ch||G.multi)return;try{const s=serialize();localStorage.setItem(SAVE_KEY,JSON.stringify(s));if(typeof cloudSave==='function')cloudSave(s,force);}catch(e){}}
function readLocal(){let d=null;try{d=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
  if(!d){try{const o=JSON.parse(localStorage.getItem(OLD_KEY));if(o&&o.v===4){d=o;d.v=5;d.cls='warrior';d.t=0;}}catch(e){}}
  return d&&d.v===5&&d.seed?d:null;}
function load(d){d=d||readLocal();if(!d)return false;
  try{newGame(d.seed,{medals:d.medals,biome:d.biome,life:d.life,cls:d.cls||'warrior'});const du=d.up||{};for(const k in G.up)if(typeof du[k]==='number')G.up[k]=du[k];G.upBase=d.upBase||{};
    G.cash=d.cash||0;Object.assign(G.stock,d.stock||{});G.paid=d.paid||{};G.pile=d.pile||0;G.day=d.day||1;G.dayT=d.dayT||0;G.time=d.time||0;Object.assign(G.stats,d.stats||{});G.hintStep=d.hintStep||0;
    G.p.carry=d.carry||0;G.relics=d.relics||{};G.element=d.element||null;G.ult=d.ult||0;G.fence=d.fence==null?1:d.fence;if(d.clock)Object.assign(G.clock,d.clock);G.weatherN=d.weatherN||0;G.raidN=d.raidN||0;
    if(d.lairs)d.lairs.forEach((l,i)=>{if(G.lairs[i]){G.lairs[i].cool=l.cool||0;G.lairs[i].lv=l.lv||0;}});if(d.lairDone)G.lairDone=d.lairDone.slice(0,LAIRS.length);G.conquered=!!d.conquered;
    if(d.q)G.q=d.q;else G.q={i:0,base:0};G.raidsOn=!!d.raidsOn||G.q.i>=8;if(d.lairOpen)G.lairOpen=d.lairOpen.slice(0,LAIRS.length);if(Array.isArray(d.pick))G.pick=d.pick.filter(e=>e.type==='element'||e.type==='relic').map(e=>({type:e.type,src:e.src}));
    for(let i=0;i<LAIRS.length;i++){const qi=QUESTS.findIndex(q=>q.k==='lair'&&q.i===i);if(G.q.i>=qi)G.lairOpen[i]=true;}
    if(G.clock.raid<20)G.clock.raid=20;G.raidWarned=false;
    G.stock={raw:G.stock.raw||0,cooked:G.stock.cooked||0};G.p.hp=P.maxHp();G.hunters=[];syncHunters();return true;}catch(e){console.error(e);return false;}}

// ===== systems: goal chain, events, bosses, relics, ult, pet, weapon modules =====
function ultMul(){return 1+0.35*rl('ultc');}
function qIndexOf(k,extra){return QUESTS.findIndex(q=>q.k===k&&(!extra||Object.keys(extra).every(x=>q[x]===extra[x])));}
function onQuestStart(){const q=qDef();G.q.base=q.k==='kills'?G.stats.kills:q.k==='sold'?G.stats.sold:q.k==='golden'?G.stats.golden:0;
  if(q.k==='golden'&&!G.enemies.some(e=>e.golden))spawnGolden(true);
  if(q.k==='raid'&&!G.raidsOn){G.raidsOn=true;G.clock.raid=Math.min(G.clock.raid,40);}
  if(q.k==='lair'){G.lairOpen[q.i]=true;}}
function updateQuest(dt){if(G.q.i>=QUESTS.length-1)return;const q=qDef();if(!qDone(q))return;
  const reward=Math.round(P.price()*P.income()*(60+30*G.q.i));G.cash+=reward;earn(reward);
  if(typeof goalDone==='function')goalDone(q,reward);sfx('mission');
  G.q.i++;onQuestStart();save(true);}
// ----- fence -----
function damageFence(a){if(G.fence<=0)return;G.fence=Math.max(0,G.fence-a);G.fenceHitT=G.time;
  if(G.fence<=0){G.closedT=Math.max(G.closedT,20);G.closedWhy='방벽 붕괴';toast('방벽이 무너졌다 · 손님이 도망쳤다','bad');sfx('break');for(const c of G.customers)if(c.state!=='leave'){c.state='leave';c.bub='!';c.bubT=1.5;}}}
function updateFence(dt){if(G.time-G.fenceHitT>4&&G.fence<1)G.fence=Math.min(1,G.fence+dt*0.02*(1+0.15*G.up.camp));}
// ----- events -----
function raidType(){return pick(BANDS[Math.min(BANDS.length-1,1+Math.floor((G.day-1)/3)+Math.floor(G.raidN/3))]);}
function raidLvl(){return 2+G.day+G.raidN;}
function busy(){return !!(G.raid||G.raidWarned||(G.ev&&G.ev.kind==='blizzard'));}
function biomeRule(){return ['',"ice","lava","night"][G.biome%BIOMES.length];}
function updateEvents(dt){const C=G.clock;
  if(G.ev){const ev=G.ev;ev.t+=dt;
    if(ev.kind==='blizzard'){ev.spawnT=(ev.spawnT||0)-dt;if(ev.spawnT<=0){ev.spawnT=1.8;blizzardPack();}
      if(ev.t>=ev.dur){G.stats.bliz++;G.ev={kind:'rush',t:0,dur:30};G.closedT=0;toast('눈보라가 그쳤다 · 손님이 몰려온다','ok');for(const e of G.enemies)if(e.state==='raid')e.state='return';}}
    else if(ev.t>=ev.dur)G.ev=null;}
  else if(G.stats.raidsWon>=1&&!G.raid&&!G.raidWarned&&C.raid>70){C.weather-=dt;if(C.weather<=0)startWeather();}
  if(qDef().k==='golden'&&!G.enemies.some(e=>e.golden)){G.goldRetryT=(G.goldRetryT==null?20:G.goldRetryT)-dt;if(G.goldRetryT<=0){G.goldRetryT=20;spawnGolden(true);}}
  if(G.stats.golden>=1&&!busy()){C.gold-=dt;if(C.gold<=0){C.gold=rnd(200,260);if(!G.enemies.some(e=>e.golden))spawnGolden(false);}}
  if(G.raidsOn)updateRaid(dt);
  updateThrone();updateBiomeRules(dt);
  if(G.closedT>0)G.closedT=Math.max(0,G.closedT-dt);}
function startWeather(){G.weatherN++;G.clock.weather=biomeRule()==='ice'?rnd(110,150):rnd(240,300);G.ev={kind:'blizzard',t:0,dur:35,spawnT:2};G.closedT=Math.max(G.closedT,35);G.closedWhy='눈보라 휴업';banner('화이트아웃','괴물 떼가 방벽을 노린다 · 잡으면 고기 2배','blizzard');sfx('blizzard');}
function blizzardPack(){if(G.enemies.filter(e=>e.state==='raid').length>=30)return;for(let k=0;k<6;k++){const a=rnd(0,6.283),r=rnd(250,320);const x=G.camp.x+Math.cos(a)*r,y=G.camp.y+Math.sin(a)*r;if(!spawnOk(x,y,90))continue;const type=raidType();const n=ri(3,4);for(let i=0;i<n;i++)spawnEnemy(type,x+rnd(-20,20),y+rnd(-20,20),'raid',raidLvl()-1);return;}}
// ----- frontier rules: lava eruptions (volcano), long nights + aurora (polar) -----
function updateBiomeRules(dt){const r=biomeRule(),p=G.p;
  if(r==='lava'){G.lavaT-=dt;for(const z of G.lava)z.t+=dt;G.lava=G.lava.filter(z=>z.t<z.dur);
    if(G.lavaT<=0&&!G.lava.length){G.lavaT=rnd(38,50);const n=5+Math.min(4,Math.floor(G.day/2));for(let i=0;i<n;i++){for(let k=0;k<10;k++){const a=rnd(0,6.283),rr=rnd(80,300);const x=p.x+Math.cos(a)*rr,y=p.y+Math.sin(a)*rr;if(x<40||y<40||x>WW-40||y>WH-40||inCompound(x,y))continue;G.lava.push({x,y,r:rnd(26,40),t:0,dur:24,tick:0});addTele({kind:'circle',x,y,r:40,dur:1.6,dmg:0.12,owner:null,small:1,lava:1});break;}}
      banner('용암 분출','붉은 땅을 밟지 말자 · 분출 중 수입 2배','raid');sfx('slam');}
    if(!p.dead&&p.inv<=0)for(const z of G.lava){if(z.t<1.6)continue;if(dist(p.x,p.y,z.x,z.y)<z.r){hurtPlayer(P.maxHp()*0.07,z,true);break;}}}
  else if(r==='night'){const night=G.dayT>DAY_LEN*0.55;if(night!==G.night){G.night=night;if(night){toast('밤이 왔다 · 괴물이 빨라지고 시야가 좁아진다','warn');if(Math.random()<0.6)G.auroraSoon=rnd(10,40);}else{toast('동이 튼다','ok');G.auroraSoon=0;}}
    if(G.auroraT>0){G.auroraT-=dt;if(G.auroraT<=0)toast('오로라가 사라졌다','info');}
    else if(G.night&&G.auroraSoon>0){G.auroraSoon-=dt;if(G.auroraSoon<=0){G.auroraT=30;G.stats.aurora++;banner('오로라','하늘이 춤춘다 · 30초 동안 수입 3배','gold');sfx('gold');}}}
  else G.night=false;}

function spawnGolden(near){for(let k=0;k<30;k++){const a=rnd(0,6.283),r=near?rnd(180,260):rnd(200,360);const x=G.camp.x+Math.cos(a)*r,y=G.camp.y+Math.sin(a)*r;if(!spawnOk(x,y,150))continue;

  banner('황금곰 출현','도망가기 전에 잡으면 유물 상자','gold');sfx('gold');return;}}
function updateGolden(e,dt,spd){e.life-=dt;if(e.life<=0){e.gone=true;toast('황금곰이 도망쳤다','warn');return;}

  if(pd<180){if(e.restT>0){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;let tx=e.x+dx/d*80,ty=e.y+dy/d*80;if(tx<70||tx>WW-70||ty<70||ty>WH-70){tx=e.x-dy/d*80;ty=e.y+dx/d*80;}if(!steer(e,tx,ty,spd,dt,2))e.restT=-0.01;}}
  else{if(dist(e.x,e.y,e.tx,e.ty)<6){e.tx=clamp(e.home.x+rnd(-80,80),40,WW-40);e.ty=clamp(e.home.y+rnd(-80,80),40,WH-40);}steer(e,e.tx,e.ty,spd*0.4,dt,2);}}
function onGoldenDead(e){G.stats.golden++;spawnItem('chest',e.x,e.y,1);dropMeat(e.x,e.y,e.meat*2);

// ----- bosses -----
function bossDef(e){return e.bi<0?THRONE_BOSS:BOSSES[e.bi];}
function bossName(D,aw,mode){const B=biomeDef(G.biome);return mode==='throne'?(B.bossPre?B.bossPre+'군주':D.n):(aw?'각성한 ':'')+B.bossPre+D.n;}
function estDps(){const t=P.tier(),d=P.dmg();let dps=d/P.cd()*(1+P.crit()*1.5);if(G.cls==='archer')dps*=[1,1.6,1.8,2.2,3.0,3.4][t]*0.7;if(G.cls==='mage')dps*=[1,1.2,1.4,2.4,2.7,4][t]*0.8;if(G.cls==='rogue')dps*=[1.6,2.2,3.2,3.4,4.2,4.6][t]*0.6;if(G.cls==='warrior')dps*=[1.15,1.3,1.6,1.7,2.0,2.3][t];
  const nb=bladeCount();if(nb)dps+=nb*d*0.5/0.32*0.4;if(G.up.pet)dps+=petDmg(G.up.pet)/0.65;if(G.element==='fire')dps*=1.25;return dps;}
function makeBoss(bi,aw,x,y,mode,lv){const D=bi<0?THRONE_BOSS:BOSSES[bi%BOSSES.length];const dps=estDps();const curve=2500*Math.pow(1.7,lv)*BM(G.biome);
  const lo=mode==='throne'?50:mode==='lair'?32:mode==='arena'?14:24,hi=mode==='throne'?80:mode==='lair'?50:mode==='arena'?22:40;const hp=Math.round(clamp(curve,lo*dps,hi*dps));
  const e={type:'boss',boss:D,bi:bi<0?-1:bi%BOSSES.length,aw,x,y,home:{x,y},hp,maxHp:hp,dmg:0,spd:D.spd*(1+0.08*aw),meat:30+12*lv,r:D.r*(mode==='throne'?1.2:1),ag:260,lvl:lv+1,mode,phase:1,
    state:mode==='raid'||mode==='arena'?'march':'sleep',sleep:mode!=='raid'&&mode!=='arena',atkT:2.2,act:null,actI:-1,bite:1,face:'left',anim:0,flash:0,kx:0,ky:0,gone:false,sq:0,
    name:bossName(D,aw,mode)};
  G.enemies.push(e);return e;}
function denR(e){return e.mode==='throne'?DUEL_R.throne:e.mode==='lair'?DUEL_R.lair:0;}
function wakeBoss(e){if(!e.sleep)return;e.sleep=false;e.state='fight';e.atkT=1.8;banner(e.name,e.mode==='throne'?'최종 결전 · 방어 타이밍을 맞추면 보스가 휘청인다':'바닥의 붉은 표시를 피하자 · 공격은 버튼으로','raid');sfx('bossroar');if(e.mode==='lair'||e.mode==='throne')startDuel(e);}
function updateRaid(dt){const C=G.clock;
  if(!G.raid){if(G.ev&&G.ev.kind==='blizzard')return;C.raid-=dt;
    if(C.raid<=15&&!G.raidWarned){G.raidWarned=true;G.raidDir=ri(0,3);const D=BOSSES[G.raidN%BOSSES.length];banner('보스 습격 예고',DIRN[G.raidDir]+'에서 '+biomeDef(G.biome).bossPre+D.n+'이(가) 온다','raid');sfx('raid');}
    if(C.raid<=0)spawnRaid();return;}
  G.raid.t+=dt;}
function spawnRaid(){const d=G.raidDir,dx=[0,1,0,-1][d],dy=[-1,0,1,0][d];let x=G.camp.x+dx*400+dy*rnd(-60,60),y=G.camp.y+dy*400+dx*rnd(-60,60);x=clamp(x,70,WW-70);y=clamp(y,70,WH-70);
  const bi=G.raidN%BOSSES.length,aw=Math.floor(G.raidN/BOSSES.length);const b=makeBoss(bi,aw,x,y,'raid',G.raidN);G.raid={boss:b,t:0};
  const n=Math.min(20,6+G.raidN*2);for(let i=0;i<n;i++)spawnEnemy(raidType(),x+rnd(-55,55),y+rnd(-55,55),'raid',raidLvl());
  banner('보스 습격',b.name+' 등장 · 방벽에 닿기 전에 막자','raid');sfx('bossroar');}
function throneQ(){return qIndexOf('throne');}
function updateThrone(){if(G.conquered||G.q.i<throneQ())return;if(G.throne&&(G.throne.hp<=0||G.throne.gone))G.throne=null;
  if(!G.throne){const c=wp(THRONE.x,THRONE.y);G.throne=makeBoss(-1,1,c.x,c.y,'throne',G.raidN+6);}}
function updateLairs(dt){for(let i=0;i<LAIRS.length;i++){const L=LAIRS[i],S=G.lairs[i];if(!G.lairOpen[i]||G.lairDone[i])continue;
  if(S.boss){if(S.boss.hp<=0||S.boss.gone)S.boss=null;continue;}
  const c=wp(L.x,L.y);const b=makeBoss((L.b+G.biome)%BOSSES.length,0,c.x,c.y,'lair',G.raidN+i+1);b.lairI=i;S.boss=b;}}
function updateBoss(e,dt){e.anim+=dt;if(e.flash>0)e.flash-=dt;if(e.lunge>0)e.lunge-=dt;if(e.sq>0)e.sq-=dt;if(e.stag>0){e.stag-=dt;return;}
  const p=G.p,pd=p.dead?1e9:dist(e.x,e.y,p.x,p.y),pin=inCompound(p.x,p.y);
  const den=denR(e);
  if(e.sleep){if(den?(dist(p.x,p.y,e.home.x,e.home.y)<den-8&&!p.dead):(pd<130&&!pin))wakeBoss(e);if(e.hp<e.maxHp)e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.02*dt);return;}
  if(e.mode==='raid'&&!G.duel&&!p.dead&&!pin&&pd<150)startDuel(e);
  if(den){const hd=dist(e.x,e.y,e.home.x,e.home.y);if(hd>den-e.r*0.5){const k=(den-e.r*0.5)/hd;e.x=e.home.x+(e.x-e.home.x)*k;e.y=e.home.y+(e.y-e.home.y)*k;}if(!G.duel&&!p.dead&&dist(p.x,p.y,e.home.x,e.home.y)<den-8)startDuel(e);}
  // phase 2: faster, meaner attack list
  if(e.phase===1&&e.hp<e.maxHp*(e.mode==='throne'||e.raidBoss?0.6:0.5)){e.phase=2;e.act=null;e.actI=-1;e.atkT=1.0;e.spd*=1.25;G.tele=G.tele.filter(t=>t.owner!==e);banner(e.name+' 분노','패턴이 바뀐다 · 더 빨라진다','raid');sfx('bossroar');shake(8);if(G.multi&&G.multi.host)mpEvent({k:'banner',a:[e.name+' 분노','패턴이 바뀐다 · 더 빨라진다','raid']});G.slowT=0.5;for(let i=0;i<14;i++)spawnParts(e.x+rnd(-20,20),e.y+rnd(-20,20),'#ff4a4a',1);}
  if(e.mode==='lair'||e.mode==='throne'){if(dist(p.x,p.y,e.home.x,e.home.y)>den+10||p.dead){e.resetT=(e.resetT||0)+dt;if(e.resetT>3){e.sleep=true;e.state='sleep';e.x=e.home.x;e.y=e.home.y;e.act=null;e.resetT=0;e.phase=1;e.hp=Math.max(e.hp,e.maxHp*0.5);G.tele=G.tele.filter(t=>t.owner!==e);if(G.duel&&G.duel.boss===e)endDuel();return;}}else e.resetT=0;}
  if(e.mode==='leave'){const h=e.home;if(dist(e.x,e.y,h.x,h.y)<10)e.gone=true;else steer(e,h.x,h.y,e.spd*1.6,dt,2);return;}
  if(e.act){runAct(e,dt);return;}
  const sp=e.spd*(e.slow>0?0.6:1);
  e.atkT-=dt;if(e.atkT<=0&&pd<300&&!p.dead){startAct(e);return;}
  const chaseR=e.mode==='raid'?230:e.mode==='arena'?9999:320;
  if(!p.dead&&!pin&&pd<chaseR){if(pd>e.r+10)steer(e,p.x,p.y,sp,dt,2);else{e.bite-=dt;if(e.bite<=0){e.bite=1;e.lunge=0.2;hurtPlayer(P.maxHp()*0.06,e);}}return;}
  if(e.mode==='raid'){const fp=fencePoint(e.x,e.y);if(dist(e.x,e.y,fp.x,fp.y)>e.r*0.6+6){steer(e,fp.x,fp.y,sp,dt,2);e.siege=false;}
    else{e.siege=true;e.bite-=dt;if(e.bite<=0){e.bite=1;e.lunge=0.25;damageFence(0.045);sfx('bash');}if(G.fence<=0)bossRampage(e);}}
  else if(e.mode!=='arena'&&dist(e.x,e.y,e.home.x,e.home.y)>8)steer(e,e.home.x,e.home.y,sp,dt,2);}
function bossRampage(e){if(e.looted)return;e.looted=true;const s=G.stock;let lost=0;for(const k of['raw','cooked']){const n=Math.floor(s[k]*0.4);s[k]-=n;lost+=n;}const lp=Math.floor(G.pile*0.3);G.pile-=lp;
  G.closedT=Math.max(G.closedT,25);G.closedWhy='약탈 피해';const sh=wp(POS.shelf.x,POS.shelf.y);for(let i=0;i<6;i++)flyer(sh.x,sh.y-8,e.x,e.y-20,'meat');
  banner('약탈당했다',e.name+'이(가) 고기와 돈을 빼앗아 갔다','bad');sfx('break');
  e.mode='leave';G.raid=null;G.raidWarned=false;G.stats.raidsLost++;G.raidN++;G.clock.raid=rnd(280,340);G.tele=G.tele.filter(t=>t.owner!==e);for(const o of G.enemies)if(o.state==='raid')o.state='return';}
function addTele(t){t.t=0;G.tele.push(t);}
// attack kinds: slam, shards, charge, breath, summon, bombs, ring, cross, laser, rush, pull
function startAct(e){const D=bossDef(e),p=G.p,list=e.phase===2?D.p2:D.p1;e.actI=(e.actI+1)%list.length;const k=list[e.actI];const aw=e.aw,fast=(e.phase===2?0.85:1)*(e.mode==='throne'||e.raidBoss?0.85:1);
  const toP=Math.atan2(p.y-e.y,p.x-e.x);
  if(k==='slam'){addTele({kind:'circle',x:e.x,y:e.y,r:e.r*1.9+30,dur:(1.2-0.04*Math.min(aw,4))*fast,dmg:0.3,owner:e});e.act={k,t:0,dur:1.25*fast};}
  else if(k==='shards'){const n=4+Math.min(aw,4)+(e.phase===2?2:0);for(let i=0;i<n;i++)addTele({kind:'circle',x:p.x+(i?rnd(-80,80):0),y:p.y+(i?rnd(-70,70):0),r:24,dur:(1.0+i*0.08)*fast,dmg:0.16,owner:e,small:1});e.act={k,t:0,dur:0.6};}
  else if(k==='charge'){const len=Math.min(300,dist(e.x,e.y,p.x,p.y)+90);addTele({kind:'line',x:e.x,y:e.y,a:toP,len,w:e.r*2+14,dur:1.0*fast,dmg:0.28,owner:e});e.act={k,t:0,dur:1.0*fast,a:toP,len,dash:0};}
  else if(k==='breath'){addTele({kind:'cone',x:e.x,y:e.y,a:toP,arc:1.0,len:210,dur:1.05*fast,dmg:0.3,owner:e,breath:1});e.act={k,t:0,dur:1.3*fast,a:toP};}
  else if(k==='summon'){const n=4+aw+(e.phase===2?2:0);for(let i=0;i<n;i++){const m=spawnEnemy(G.ch?chalType():raidType(),e.x+rnd(-50,50),e.y+rnd(-50,50),'chase',G.ch?chalLevel():raidLvl());m.tgt=p;m.tgtKind='p';m.home={x:e.x,y:e.y};}e.act={k,t:0,dur:0.8};}
  else if(k==='bombs'){const n=6+Math.min(aw,3)+(e.phase===2?3:0);for(let i=0;i<n;i++){const a=rnd(0,6.283),r=rnd(30,170);addTele({kind:'circle',x:clamp(p.x+Math.cos(a)*r,30,WW-30),y:clamp(p.y+Math.sin(a)*r,30,WH-30),r:30,dur:(0.9+i*0.12)*fast,dmg:0.2,owner:e,small:1});}e.act={k,t:0,dur:0.7};}
  else if(k==='ring'){// safe spot: right next to the boss or far away
    addTele({kind:'ring',x:e.x,y:e.y,r:e.r*1.2+150,dur:1.5*fast,dmg:0.34,owner:e});e.act={k,t:0,dur:1.6*fast};}
  else if(k==='cross'){const base=toP;for(let i=0;i<4;i++)addTele({kind:'line',x:e.x,y:e.y,a:base+i*Math.PI/2,len:260,w:28,dur:1.1*fast,dmg:0.26,owner:e});e.act={k,t:0,dur:1.2*fast};}
  else if(k==='laser'){// sweeping beam: starts beside the player and sweeps across
    const dir=Math.random()<0.5?1:-1;addTele({kind:'sweep',x:e.x,y:e.y,a:toP-dir*1.1,a0:toP-dir*1.1,spin:dir*1.5,len:300,w:26,dur:2.4*fast,warm:0.8,dmg:0.22,owner:e});e.act={k,t:0,dur:2.5*fast};}
  else if(k==='rush'){e.act={k,t:0,dur:0.6*fast,n:0,max:3,a:toP,len:0,dash:0,phase:'warn'};addTele({kind:'line',x:e.x,y:e.y,a:toP,len:220,w:e.r*2+10,dur:0.6*fast,dmg:0.22,owner:e});}
  else if(k==='pull'){addTele({kind:'circle',x:e.x,y:e.y,r:e.r*1.6+40,dur:1.6*fast,dmg:0.32,owner:e});e.act={k,t:0,dur:1.6*fast,pull:1};}
  e.atkT=rnd(2.0,2.8)/(1+0.1*aw)*(e.phase===2?0.75:1)*(e.mode==='throne'||e.raidBoss?0.7:1);sfx('warn');if(G.multi&&G.multi.host)mpEvent({k:'sfx',s:'warn'});}
function runAct(e,dt){const a=e.act,p=G.p;a.t+=dt;
  if(a.k==='charge'&&a.t>=a.dur){const step=Math.min(560*dt,a.len-a.dash);const nx=e.x+Math.cos(a.a)*step,ny=e.y+Math.sin(a.a)*step;if(inFence(nx,ny,true)||inCompound(nx,ny)||nx<30||ny<30||nx>WW-30||ny>WH-30){e.act=null;return;}e.x=nx;e.y=ny;a.dash+=step;if(G.parts.length<170)spawnParts(e.x,e.y,'#e8f4ff',1);if(a.dash>=a.len-0.5)e.act=null;return;}
  if(a.k==='rush'){if(a.phase==='warn'){if(a.t>=a.dur){a.phase='dash';a.len=220;a.dash=0;}return;}
    const step=Math.min(640*dt,a.len-a.dash);const nx=e.x+Math.cos(a.a)*step,ny=e.y+Math.sin(a.a)*step;const blocked=inFence(nx,ny,true)||inCompound(nx,ny)||nx<30||ny<30||nx>WW-30||ny>WH-30;if(!blocked){e.x=nx;e.y=ny;}a.dash+=step;if(G.parts.length<170)spawnParts(e.x,e.y,'#ffd0d0',1);
    if(blocked||a.dash>=a.len-0.5){a.n++;if(a.n>=a.max||p.dead){e.act=null;return;}a.phase='warn';a.t=0;a.dur=0.45;a.a=Math.atan2(p.y-e.y,p.x-e.x);addTele({kind:'line',x:e.x,y:e.y,a:a.a,len:220,w:e.r*2+10,dur:0.45,dmg:0.22,owner:e});sfx('warn');}
    return;}
  if(a.k==='pull'&&!p.dead&&a.t<a.dur-0.1){const d=dist(p.x,p.y,e.x,e.y);if(d>e.r+6&&d<330){const s=Math.min(d-e.r-6,110*dt);moveEnt(p,(e.x-p.x)/d*s,(e.y-p.y)/d*s,1);}}
  if(a.t>=a.dur)e.act=null;}
function teleHit(t,x,y){if(t.kind==='circle')return dist(x,y,t.x,t.y)<t.r+4;
  if(t.kind==='ring'){const d=dist(x,y,t.x,t.y);return d>t.r*0.5-4&&d<t.r+4;}
  const dx=x-t.x,dy=y-t.y,ca=Math.cos(t.a),sa=Math.sin(t.a);const al=dx*ca+dy*sa,pe=-dx*sa+dy*ca;
  if(t.kind==='line'||t.kind==='sweep')return al>-12&&al<t.len&&Math.abs(pe)<t.w/2+4;
  const d=Math.hypot(dx,dy);if(d>t.len)return false;const n=Math.atan2(Math.sin(Math.atan2(dy,dx)-t.a),Math.cos(Math.atan2(dy,dx)-t.a));return Math.abs(n)<t.arc/2;}
function updateTele(dt){const p=G.p;for(const t of G.tele){t.t+=dt;
    if(t.kind==='sweep'){if(t.owner&&(t.owner.hp<=0||t.owner.gone)){t.done=true;t.t=t.dur+1;continue;}t.x=t.owner.x;t.y=t.owner.y;if(t.t>t.warm){t.a=t.a0+t.spin*(t.t-t.warm);if(!p.dead&&teleHit(t,p.x,p.y-2))hurtPlayer(P.maxHp()*t.dmg,t.owner,true);if(G.parts.length<170&&Math.random()<0.5)spawnParts(t.x+Math.cos(t.a)*rnd(40,t.len),t.y+Math.sin(t.a)*rnd(40,t.len),'#ff6a6a',1);}if(t.t>=t.dur)t.done=true;continue;}
    if(!t.done&&t.t>=t.dur){t.done=true;if(t.owner&&(t.owner.hp<=0||t.owner.gone))continue;
    if(!p.dead&&teleHit(t,p.x,p.y-2))hurtPlayer(P.maxHp()*t.dmg,t.owner,true);
    if(t.kind==='circle'){G.booms.push({x:t.x,y:t.y,r:t.r,t:0,col:t.small?0xbfe9ff:0x9fd8ff});spawnParts(t.x,t.y,'#e8f4ff',t.small?3:8);}
    else if(t.kind==='ring'){G.waves.push({x:t.x,y:t.y,r:t.r*0.5,R:t.r,t:0,hit:new Set(),dmg:0,who:'none',boss:1});spawnParts(t.x,t.y,'#ffb3b3',10);}
    else if(t.kind==='cone'){for(let i=0;i<10;i++){const a=t.a+rnd(-t.arc/2,t.arc/2),r=rnd(30,t.len);spawnParts(t.x+Math.cos(a)*r,t.y+Math.sin(a)*r,'#bfe9ff',1);}}
    sfx('slam');shake(5);}}
  G.tele=G.tele.filter(t=>t.t<t.dur+0.25);}
function onBossDead(e){G.stats.bosses++;G.life.bosses++;if(G.duel&&G.duel.boss===e)endDuel();G.slowT=1.0;sfx('bossdie');G.tele=G.tele.filter(t=>t.owner!==e);shake(10);hitStop(0.2);
  spawnParts(e.x,e.y-10,'#ffffff',20);spawnParts(e.x,e.y-10,'#ffd25a',14);G.booms.push({x:e.x,y:e.y,r:90,t:0,col:0xffffff});
  if(G.ch){onChalBossDead(e);return;}
  dropMeat(e.x,e.y,e.meat);
  const bounty=Math.round(P.price()*P.income()*(120+60*G.raidN));G.pile+=bounty;earn(bounty);
  if(e.mode==='raid'){G.raid=null;G.raidWarned=false;G.stats.raidsWon++;G.raidN++;G.clock.raid=rnd(280,340);banner(e.name+' 격파','습격을 막아냈다 · 현상금 '+fmt$(bounty),'win');for(const o of G.enemies)if(o.state==='raid')o.state='return';}
  else if(e.mode==='lair'){const i=e.lairI;G.lairs[i].boss=null;G.lairDone[i]=true;banner(lairName(i)+' 정복','현상금 '+fmt$(bounty),'win');}
  else if(e.mode==='throne'){G.throne=null;G.conquered=true;G.life.conquered++;banner(biomeName(G.biome)+' 정복','캠프에 개척지 이주 발판이 생겼다','conquer');}
  G.pick.push({type:'relic',src:e.mode});G.pickDelay=1.4;}
// ----- relics -----
function rollRelics(src){const W=src==='lair'||src==='throne'?[30,45,25]:src==='raid'?[45,40,15]:[62,30,8];
  const avail=Object.keys(RELICS).filter(k=>rl(k)<RELICS[k].max&&!(G.ch&&(RELICS[k].camp||k==='butcher'||k==='gold')));const out=[];
  for(let tries=0;out.length<3&&tries<60;tries++){const r=Math.random()*100,rar=r<W[0]?1:r<W[0]+W[1]?2:3;let pool=avail.filter(k=>RELICS[k].r===rar&&!out.includes(k));if(!pool.length)pool=avail.filter(k=>!out.includes(k));if(!pool.length)break;out.push(pick(pool));}
  return out;}
function takeRelic(k){G.relics[k]=(G.relics[k]||0)+1;sfx('relic');}
// ----- ultimate -----
const ULT_NAME={snow:'눈사태',fire:'화산 폭발',ice:'절대 영도',bolt:'천둥 강림'};
function updateUlt(dt){const p=G.p;if(G.ultFx){G.ultFx.t+=dt;if(G.ultFx.t>1.1)G.ultFx=null;}if(p.dead||G.ult<1)return;
  let n=0,boss=false;for(const e of G.enemies){if(e.hp<=0||e.sleep)continue;const d=dist(p.x,p.y,e.x,e.y);if(d<170){n++;if(e.boss)boss=true;}}
  if(n>=8||boss)fireUlt();}
function fireUlt(){const p=G.p,R=200,el=G.element||'snow';G.ult=0;G.ultFx={x:p.x,y:p.y,t:0,el};G.slowT=0.6;shake(12);hitStop(0.12);
  sfx('ult');if(typeof flashScreen==='function')flashScreen(el);

// ===== duel: first-person manual boss fights (lair, throne, challenge bosses) =====
// You look with a swipe (or the mouse / arrow keys), move with the left joystick (or WASD), attack with the button (J) and
// hold guard with the other button (K). A guard raised within PERFECT_T of a hit costs nothing and staggers the boss.
const DUEL_R={lair:125,throne:150,arena:0};
const PERFECT_T=0.22;
const ACT_NAME={slam:'내려찍기',shards:'얼음 파편',charge:'돌진',breath:'브레스',summon:'소환',bombs:'폭탄 살포',ring:'충격 고리 · 바짝 붙거나 멀리',cross:'십자 베기',laser:'회전 레이저 · 따라 돌아라',rush:'3연속 돌진',pull:'끌어당기기 · 밖으로 달려라'};
function duelOn(){return !!G.duel;}
function startDuel(boss){if(G.duel||!boss||boss.hp<=0)return;const p=G.p;
  const yaw=Math.atan2(boss.x-p.x,boss.y-p.y);
  G.duel={boss,t:0,yaw,pitch:0,stam:100,block:false,blockT:0,atkHeld:false,arena:boss.mode==='throne'?{x:boss.home.x,y:boss.home.y,r:DUEL_R.throne}:boss.mode==='lair'?{x:boss.home.x,y:boss.home.y,r:DUEL_R.lair}:null,lastAct:null,actT:0,hint:(G.stats.duels||0)<2?6:0,look:{id:null,x:0,y:0},perfects:0,blocked:0};
  G.stats.duels=(G.stats.duels||0)+1;G.p.vx=0;G.p.vy=0;
  if(typeof onDuelStart==='function')onDuelStart();}
function endDuel(){if(!G.duel)return;G.duel=null;if(typeof onDuelEnd==='function')onDuelEnd();}
function duelDir(){const d=G.duel;return{x:Math.sin(d.yaw),y:Math.cos(d.yaw)};}
// movement: joystick / WASD relative to where you look. Called from updatePlayer instead of the normal top-down move.
function duelMove(dt){const p=G.p,d=G.duel,inp=d.inp||joy,jx=inp.dx,jy=inp.dy,mag=Math.hypot(jx,jy);p.moving=mag>0.12;
  if(p.moving){const sp=P.spd()*Math.min(1,mag*1.4)*(d.block?0.45:1);const f=duelDir();const rx=-f.y,ry=f.x;// screen-right when looking along f
    const mx=(f.x*-jy+rx*jx)/mag,my=(f.y*-jy+ry*jx)/mag;moveEnt(p,mx*sp*dt,my*sp*dt,1);pushOut(p);p.anim+=dt*8;
    p.dir=Math.abs(f.x)>Math.abs(f.y)?(f.x<0?'left':'right'):(f.y<0?'up':'down');}
  else p.anim=0;
  if(d.arena){const a=d.arena,dx=p.x-a.x,dy=p.y-a.y,dd=Math.hypot(dx,dy);if(dd>a.r){p.x=a.x+dx/dd*a.r;p.y=a.y+dy/dd*a.r;d.wallT=0.4;}}
  if(d.wallT>0)d.wallT-=dt;}
function updateDuel(dt){const d=G.duel;if(!d)return;const p=G.p,b=d.boss;d.t+=dt;if(d.hint>0)d.hint-=dt;
  if(b.hp<=0||b.gone||(b.sleep&&d.t>1)){endDuel();return;}
  if(p.dead){endDuel();return;}
  if(b.mode==='raid'&&(d.bossDist>260||inCompound(p.x,p.y))){endDuel();return;}
  // guard & stamina
  if(d.block){d.blockT+=dt;d.stam=Math.max(0,d.stam-22*dt);if(d.stam<=0){d.block=false;d.tired=1.5;toast('기력이 다했다!','bad');}}
  else{d.blockT=0;d.stam=Math.min(100,d.stam+(d.tired>0?10:30)*dt);}
  if(d.tired>0)d.tired-=dt;
  // attack while the button is held
  if(d.atkHeld&&!d.block&&p.atkCd<=0&&!p.dead)duelAttack();
  // what the boss is winding up, for the HUD
  if(b.act&&b.act!==d.lastAct){d.lastAct=b.act;d.actT=0;d.actName=ACT_NAME[b.act.k]||b.act.k;}
  if(d.lastAct)d.actT+=dt;
  // inside a telegraph right now?
  d.danger=G.tele.some(t=>!t.done&&t.owner===b&&(t.kind==='sweep'?t.t>t.warm-0.3:t.t>t.dur*0.35)&&teleHit(t,p.x,p.y-2));
  // lock-on: the camera always swings to face the boss, so WASD / the joystick is all you need
  const a=Math.atan2(b.x-p.x,b.y-p.y);let rel=a-d.yaw;rel=Math.atan2(Math.sin(rel),Math.cos(rel));d.yaw+=rel*Math.min(1,dt*5);d.bossRel=rel;d.bossDist=dist(p.x,p.y,b.x,b.y);}
// damage taken while dueling: guard quarters it, a perfect guard negates it and staggers the boss
function duelHurtMod(dmg,heavy){const d=G.duel;if(!d||!d.block)return dmg;
  if(d.blockT<=PERFECT_T){d.perfects++;d.stam=Math.min(100,d.stam+15);sfx('parry');if(G.rings.length<24)G.rings.push({x:G.p.x,y:G.p.y-8,t:0,r:30,col:0x9fe8ff});addFx(G.p.x,G.p.y-30,'완벽 방어!','#9fe8ff',1.4,'crit');
    const b=d.boss;if(b&&b.hp>0&&!b.sleep){b.act=null;b.atkT=Math.max(b.atkT,1.4);b.stag=1.2;b.flash=0.3;G.tele=G.tele.filter(t=>t.owner!==b);}
    return 0;}
  d.blocked++;d.stam=Math.max(0,d.stam-(heavy?22:10));sfx('guard');if(G.rings.length<24)G.rings.push({x:G.p.x,y:G.p.y-8,t:0,r:18,col:0xcfe0f2});return dmg*0.25;}
// one manual attack toward where you look
function duelAttack(){const p=G.p,d=G.duel,R=P.range(),tier=P.tier(),dmg=P.dmg();const f=duelDir();const C=cls();
  p.atkAng=d.yaw;p.atkDir=Math.abs(f.x)>Math.abs(f.y)?(f.x<0?'left':'right'):(f.y<0?'up':'down');
  const inFront=(e,half,maxD)=>{const ex=e.x-p.x,ey=e.y-6-(p.y-4);const dd=Math.hypot(ex,ey)-e.r;if(dd>maxD)return false;const ea=Math.atan2(ex,ey);let r=ea-d.yaw;r=Math.atan2(Math.sin(r),Math.cos(r));return Math.abs(r)<=half;};

const FB={on:false,ready:false,user:null,nick:'',db:null,auth:null,lastSave:0,pending:null,busy:false,err:''};
const NICK_DOMAIN='@frostcamp.game';
function nickToEmail(n){let h='';for(const b of new TextEncoder().encode(n))h+=b.toString(16).padStart(2,'0');return 'n'+h+NICK_DOMAIN;}
function emailToNick(em){try{const h=em.split('@')[0].slice(1);const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return new TextDecoder().decode(a);}catch(e){return '?';}}
function fbInit(){const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||cfg.apiKey.indexOf('붙여')>=0||!window.firebase){FB.ready=true;return;}
  try{firebase.initializeApp(cfg);FB.auth=firebase.auth();FB.db=firebase.firestore();FB.on=true;
    FB.auth.onAuthStateChanged(u=>{FB.user=u;FB.nick=u?emailToNick(u.email||''):'';FB.ready=true;onAuthChange(u);});}
  catch(e){console.warn('firebase init failed',e);FB.ready=true;}}
function fbErr(e){const c=(e&&e.code)||'';if(c.includes('wrong-password'))return '비밀번호가 틀렸어요';if(c.includes('invalid-credential')||c.includes('invalid-login'))return '닉네임 또는 비밀번호가 틀렸어요. 계정이 없다면 아래에서 새로 만들어요';if(c.includes('user-not-found'))return '그 닉네임은 없어요. 먼저 가입해 주세요';if(c.includes('email-already-in-use'))return '이미 쓰는 닉네임이에요';if(c.includes('weak-password'))return '비밀번호는 6자 이상';if(c.includes('too-many-requests'))return '시도가 너무 많아요. 잠시 후 다시';if(c.includes('network'))return '인터넷 연결을 확인해 주세요';return '실패: '+(e&&e.message||e);}
function validNick(n){n=(n||'').trim();if(n.length<2||n.length>12)return '닉네임은 2~12자';if(/[\s@\/\\]/.test(n))return '닉네임에 공백은 안 돼요';return null;}
async function signUp(nick,pw){const v=validNick(nick);if(v)throw new Error(v);if(!pw||pw.length<6)throw new Error('비밀번호는 6자 이상');
  const cred=await FB.auth.createUserWithEmailAndPassword(nickToEmail(nick.trim()),pw);await FB.db.collection('users').doc(cred.user.uid).set({nick:nick.trim(),created:Date.now()},{merge:true});return cred.user;}
async function signIn(nick,pw){const v=validNick(nick);if(v)throw new Error(v);return (await FB.auth.signInWithEmailAndPassword(nickToEmail(nick.trim()),pw)).user;}

// cloud save: at most one write per ~15 s unless forced (goal cleared, upgrade bought, migration, tab hidden)
function cloudSave(s,force){if(!FB.on||!FB.user)return;const now=Date.now();FB.pending=s;if(!force&&now-FB.lastSave<15000)return;flushCloud();}
function flushCloud(){if(!FB.on||!FB.user||!FB.pending||FB.busy)return;const s=FB.pending;FB.pending=null;FB.lastSave=Date.now();FB.busy=true;
  const best=chalBest();
  FB.db.collection('users').doc(FB.user.uid).set({save:JSON.stringify(s),nick:FB.nick,t:s.t,ch:best,updated:Date.now()},{merge:true}).then(()=>{FB.busy=false;FB.synced=Date.now();}).catch(e=>{FB.busy=false;console.warn('cloud save',e);});}
async function cloudLoad(){if(!FB.on||!FB.user)return null;const snap=await FB.db.collection('users').doc(FB.user.uid).get();if(!snap.exists)return null;const d=snap.data();
  let save=null;try{save=d.save?JSON.parse(d.save):null;}catch(e){}
  if(d.ch){const b=chalBest();if((d.ch.score||0)>(b.score||0)){try{localStorage.setItem(CH_KEY,JSON.stringify(Object.assign(b,d.ch)));}catch(e){}}}
  return save&&save.v===5?save:null;}
// after login: the newer of local and cloud wins, the other is overwritten
function syncOnce(){if(FB.syncP)return FB.syncP;FB.syncP=syncAfterLogin().finally(()=>{FB.syncP=null;});return FB.syncP;}
async function syncAfterLogin(){try{const cloud=await cloudLoad();const local=readLocal();
  if(cloud&&(!local||(cloud.t||0)>(local.t||0))){localStorage.setItem(SAVE_KEY,JSON.stringify(cloud));return 'cloud';}
  if(local&&(!cloud||(local.t||0)>(cloud.t||0))){FB.pending=local;FB.lastSave=0;flushCloud();return 'local';}
  return 'same';}catch(e){console.warn(e);return 'error';}}

let AC=null,muted=false,sfxT={},MASTER=null,AMB=null,DRONE=null,musicOn=true;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.12;const g=AC.createGain();g.gain.value=0.9;comp.connect(g);g.connect(AC.destination);MASTER=comp;startAmbient();}catch(e){}}
function out(){return MASTER||AC.destination;}
function tone(f,d,type,vol,slide,delay,curve){if(!AC||muted)return;try{if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(delay||0);o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+(curve||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(out());o.start(t0);o.stop(t0+d+0.03);}catch(e){}}
// noise burst: hp/lp filters, optional filter sweep (lpTo) and delay
function noise(d,vol,hp,lp,delay,lpTo){if(!AC||muted)return;try{if(AC.state==='suspended')AC.resume();const t0=AC.currentTime+(delay||0);const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.6);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;g.gain.value=vol;let node=s;if(hp){const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;node.connect(f);node=f;}if(lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(lp,t0);if(lpTo)f.frequency.exponentialRampToValueAtTime(lpTo,t0+d);node.connect(f);node=f;}node.connect(g);g.connect(out());s.start(t0);}catch(e){}}
// punchy sub thump (kick-like)
function thump(f,d,vol,delay){tone(f,d,'sine',vol,-(f*0.7),delay,0.002);}
const ARP=(notes,step,type,vol)=>notes.forEach((f,i)=>tone(f,step*1.6,type,vol,0,i*step));
// --- ambient: a soft, slow pad with filtered wind. boss drone fades in while a boss is awake ---
function startAmbient(){if(!AC||AMB)return;try{const g=AC.createGain();g.gain.value=0;g.connect(out());
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;lp.connect(g);
  const notes=[110,164.8,196,246.9];const oscs=notes.map((f,i)=>{const o=AC.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;const og=AC.createGain();og.gain.value=0.5;o.connect(og);og.connect(lp);const lfo=AC.createOscillator();lfo.frequency.value=0.05+i*0.013;const lg=AC.createGain();lg.gain.value=0.35;lfo.connect(lg);lg.connect(og.gain);lfo.start();o.start();return o;});
  const n=AC.sampleRate*4,buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const w=AC.createBufferSource();w.buffer=buf;w.loop=true;const wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=420;wf.Q.value=0.6;const wg=AC.createGain();wg.gain.value=0.5;const wl=AC.createOscillator();wl.frequency.value=0.09;const wlg=AC.createGain();wlg.gain.value=0.3;wl.connect(wlg);wlg.connect(wg.gain);wl.start();w.connect(wf);wf.connect(wg);wg.connect(g);w.start();
  AMB={g,lp,oscs};
  const dg=AC.createGain();dg.gain.value=0;dg.connect(out());const d1=AC.createOscillator();d1.type='sawtooth';d1.frequency.value=55;const d2=AC.createOscillator();d2.type='sawtooth';d2.frequency.value=55.7;const df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=260;const dl=AC.createOscillator();dl.frequency.value=2.2;const dlg=AC.createGain();dlg.gain.value=120;dl.connect(dlg);dlg.connect(df.frequency);dl.start();d1.connect(df);d2.connect(df);df.connect(dg);d1.start();d2.start();const pulse=AC.createOscillator();pulse.type='sine';pulse.frequency.value=36;const pg=AC.createGain();pg.gain.value=0.6;const pl=AC.createOscillator();pl.frequency.value=1.4;const plg=AC.createGain();plg.gain.value=0.6;pl.connect(plg);plg.connect(pg.gain);pl.start();pulse.connect(pg);pg.connect(dg);pulse.start();
  DRONE={g:dg};}catch(e){}}
function updateMusic(dt){if(!AC||!AMB)return;const want=muted||!musicOn||!G||!G.live?0:0.05;const b=G&&G.live&&!muted&&musicOn&&activeBoss()?0.07:0;const k=Math.min(1,dt*1.5);AMB.g.gain.value+=(want*(b?0.4:1)-AMB.g.gain.value)*k;if(DRONE)DRONE.g.gain.value+=(b-DRONE.g.gain.value)*k;}
function sfx(k){const now=performance.now();const lim={hit:60,whiff:150,guard:80,slash:90,slam2:200,arrow:55,cast:120,throw:45,stab:50,pick:40,bite:120,die:50,cash:45,sell:80,shot:70,boom:110,gem:60,slam:90,warn:200,wave:150,heavy:150,growl:400,bash:300,crit:120}[k];if(lim&&sfxT[k]&&now-sfxT[k]<lim)return;sfxT[k]=now;

window.addEventListener('keyup',e=>{const k=keyOf(e);keys[k]=false;if(G&&G.duel){if(k==='j')G.duel.atkHeld=false;if(k==='k')duelSetBlock(false);}if(k==='a'||k==='arrowleft'||k==='d'||k==='arrowright')joy.dx=0;if(k==='w'||k==='arrowup'||k==='s'||k==='arrowdown')joy.dy=0;});
function duelKeyLook(dt){}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G){save(true);if(typeof flushCloud==='function')flushCloud();}});
window.addEventListener('pagehide',()=>{if(G){save(true);if(typeof flushCloud==='function')flushCloud();}});
// ===== main loop =====
let last=0;
window.__fc={g:()=>G,set:f=>f(G),step:dt=>{update(dt);},joy,P,UPG,ORDER,PADS,POS,QUESTS:undefined,get QUESTS(){return QUESTS;},CLASSES,wp:(x,y)=>wp(x,y),apply:applyUpgrade,startGame:(c)=>{newGame(0,{cls:c||'warrior'});startGame();},startChallenge:(c)=>startChallenge(c||'warrior'),proj:(x,y,z)=>proj(x,y,z),
  autoPick:()=>{const e=G.pick[0];if(!e)return null;if(e.type==='element'){G.element=pick(['fire','ice','bolt']);G.pick.shift();return 'elem';}if(e.type==='lvl'){const o=rollLvl();G.pick.shift();if(o[0].relic)takeRelic(o[0].relic);else LVL_OPTS[o[0].k].f();return 'lvl';}const o=rollRelics(e.src);G.pick.shift();if(o.length){takeRelic(o[0]);return o[0];}return null;},
  showPick:()=>showPick(),lock:k=>padLockMsg(k),vis:k=>padVisible(k),teleHit:(t,x,y)=>teleHit(t,x,y),estDps:()=>estDps(),q:()=>({i:G.q.i,t:qDef().t,v:qVal(),n:qNeed()}),doMigrate:(c)=>{doMigrate(c);buildWorld();},spawnRaid:()=>{G.raidDir=0;spawnRaid();},golden:()=>spawnGolden(true),weather:()=>startWeather(),FB,panel:()=>curPanel&&curPanel.name,act:a=>handleAction(a.split(':')),mp:()=>MP,load:()=>load(),duelBlock:on=>duelSetBlock(on),duelLook:(x,y)=>duelLook(x,y)};
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;if(!G)return;
  let sdt=dt;if(!paused){duelKeyLook(dt);G.slowT=0;G.hitStop=0;/* no slow-motion or hit-stop: time always runs at full speed */update(sdt);if(G.pick.length&&!curPanel&&G.pickDelay<=0&&(!G.p.dead||G.ch)&&!(G.ch&&G.ch.over))showPick();}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*22);
  renderFrame(paused?0:sdt,dt);updateHUD(dt);updateToast(dt);updateBanner(dt);updateMusic(dt);}
function init(){if(!('ontouchstart' in window)&&!(navigator.maxTouchPoints>0))document.body.classList.add('notouch');initRender();resize();newGame();G.live=false;buildWorld();showP(titlePanel);fbInit();requestAnimationFrame(ts=>{last=ts;loop(ts);});}
function boot(){const fl=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('800 12px "Noto Sans KR"'),document.fonts.load('400 20px "Black Han Sans"')]).catch(()=>{}):Promise.resolve();
  Promise.race([fl,new Promise(r=>setTimeout(r,1500))]).then(init,init);}
boot();
